name: Milestone 2 - Test pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize pipelines for main; a new push never cancels an ongoing rollout.
concurrency:
  group: photo-release-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit and HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: photo
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: photo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U photo -d photo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://photo:integration_only@localhost:5432/photo_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test

  build-and-deploy-test:
    name: Build image and roll out to Test
    needs: unit-tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, photo-local]
    timeout-minutes: 20
    environment: test
    defaults:
      run:
        shell: powershell
    env:
      IMAGE: photo-service:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check local Docker and Kubernetes
        run: |
          docker --context desktop-linux info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop is not available.' }
          kubectl --context docker-desktop get nodes --request-timeout=15s
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop Kubernetes is not available.' }
      - name: Build a unique image for this commit and run
        run: |
          docker --context desktop-linux build --build-arg "APP_REVISION=$env:REVISION" -t $env:IMAGE .
          if ($LASTEXITCODE -ne 0) { throw 'Image build failed.' }
      - name: Roll out and verify the deployed revision through Ingress
        run: |
          & .\scripts\deploy-test.ps1 -Image $env:IMAGE -ExpectedRevision $env:REVISION -ReleaseFile "$env:RUNNER_TEMP\photo-release\test-release.json"
      - name: Preserve the validated release identity
        uses: actions/upload-artifact@v7
        with:
          name: validated-test
          path: ${{ runner.temp }}/photo-release/test-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Record deployment evidence
        run: |
          @"
          ## Test deployment
          - Commit: $env:REVISION
          - Image: $env:IMAGE
          - Namespace: test
          - Ingress host: photo-test.local
          - Rollout and HTTP smoke checks: passed
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context docker-desktop get pods -n test -o wide --request-timeout=15s
          kubectl --context docker-desktop describe deployment/photo-service -n test --request-timeout=15s
          kubectl --context docker-desktop get events -n test --sort-by=.metadata.creationTimestamp --request-timeout=15s

  publish-school-image:
    name: Publish private school image to GHCR
    needs: build-and-deploy-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and publish a private versioned image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"
          api="https://api.github.com/users/${owner}/packages/container/${package}"
          status=$(curl --silent --show-error --output package-info.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' "$api")
          if [ "$status" = 200 ]; then
            python3 -c "import json; p=json.load(open('package-info.json')); assert p['visibility']=='private', 'Refusing to publish private application code into a non-private package'"
          elif [ "$status" != 404 ]; then
            echo "Cannot verify package visibility (HTTP $status)."
            exit 1
          fi
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg "APP_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${image}:${tag}" .
          docker push "${image}:${tag}"
          curl --fail --silent --show-error --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' "$api" --output package-info.json
          python3 -c "import json; p=json.load(open('package-info.json')); assert p['visibility']=='private', 'Expected a private package'"
          digest=$(docker image inspect "${image}:${tag}" --format '{{index .RepoDigests 0}}')
          {
            echo '## Private school image'
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Tag: ${image}:${tag}"
            echo "- Deploy by digest: ${digest}"
            echo '- Visibility: private (verified)'
            echo '- School deployment requires a separate read:packages credential.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
