apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-service
  namespace: dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: photo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photo-service
                port:
                  number: 80
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photo-service
                port:
                  number: 80
