apiVersion: v1
kind: Service
metadata:
  name: photo-service
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: photo-service
  ports:
    - name: http
      port: 80
      targetPort: http
  sessionAffinity: None
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-service
  namespace: prod
spec:
  ingressClassName: traefik
  rules:
    - host: prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photo-service
                port:
                  number: 80
