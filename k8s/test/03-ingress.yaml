apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-service
  namespace: test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: photo-test.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: photo-service
            port:
              number: 80
  - host: test.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: photo-service
            port:
              number: 80
