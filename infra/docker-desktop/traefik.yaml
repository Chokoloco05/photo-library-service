apiVersion: v1
kind: Namespace
metadata:
  name: photo-ingress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: photo-ingress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: photo-traefik
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: photo-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: photo-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: photo-ingress
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: photo-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: photo-traefik
  template:
    metadata:
      labels:
        app: photo-traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.6.10
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.ingressendpoint.publishedservice=photo-ingress/traefik
            - --entrypoints.web.address=:8000
            - --entrypoints.websecure.address=:8443
            - --entrypoints.health.address=:9000
            - --ping=true
            - --ping.entrypoint=health
            - --accesslog=true
            - --accesslog.format=json
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: health
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: photo-ingress
spec:
  type: LoadBalancer
  selector:
    app: photo-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
