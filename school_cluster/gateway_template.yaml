apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team5-routes
  namespace: team5
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
  hostnames:
    - team5.laboinfo-ecam.be
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: photo-service
          port: 80
